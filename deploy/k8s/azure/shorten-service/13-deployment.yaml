apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorten-service
  namespace: urlshortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shorten-service
  template:
    metadata:
      labels:
        app: shorten-service
        tier: app
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  tier: app
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: <acr>.azurecr.io/shorten-service:v1
          ports:
            - name: http
              containerPort: 8000
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef: { name: shorten-service-config }
            - secretRef:    { name: shorten-service-secret }
          startupProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "64Mi"
            limits:
              memory: "256Mi"