apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-service-migrate
  namespace: urlshortener
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: <acr>.azurecr.io/analytics-service:v1
          command: ["/app/migrate"]
          envFrom:
            - configMapRef: { name: analytics-service-config }
            - secretRef:    { name: analytics-service-secret }